<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How I Decide What Gets Automated</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #F5EFE0; }
  body { display: flex; align-items: center; justify-content: center; }
  svg.canvas { height: 100vh; width: auto; display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" class="canvas">
  <style>
    text { font-family: 'Nunito', 'Trebuchet MS', Arial, sans-serif; }
    .title { font-family: 'Baloo 2', 'Trebuchet MS', Arial, sans-serif; font-weight: 800; font-size: 64px; fill: #EA6A47; letter-spacing: 1px; }
    .subtitle { font-weight: 700; font-size: 25px; fill: #2E2A26; }
    .cardh { font-weight: 800; font-size: 21px; fill: #2E2A26; }
    .b1 { font-weight: 700; font-size: 17.5px; fill: #2E2A26; }
    .b2 { font-weight: 600; font-size: 15px; fill: #6B655E; }
    .pill-t { font-weight: 700; font-size: 16.5px; fill: #2E2A26; }
    .sbt { font-weight: 800; font-size: 16px; fill: #2E2A26; }
    .sbs { font-weight: 600; font-size: 13.5px; fill: #6B655E; }
    .chk { font-weight: 700; font-size: 13.5px; fill: #2E2A26; }
    .note { font-weight: 800; font-size: 15px; fill: #D95B39; }
    .lbl { font-weight: 800; font-size: 15.5px; fill: #2E2A26; }
    .h1sub { font-weight: 600; font-size: 15px; fill: #6B655E; font-style: italic; }
  </style>

  <defs>
    <path id="loop" d="M 184 280 L 184 244 L 702 244 L 702 1272 L 346 1272 L 346 244 L 184 244 Z"/>
  </defs>

  <!-- background -->
  <rect x="0" y="0" class="canvas" fill="#F5EFE0"/>

  <!-- connector loop line (single source of truth, shared with balls) -->
  <use href="#loop" fill="none" stroke="#2E2A26" stroke-width="3" stroke-linejoin="round"/>

  <!-- arrowheads -->
  <polygon points="176,268 192,268 184,280" fill="#2E2A26"/>
  <polygon points="694,290 710,290 702,302" fill="#2E2A26"/>
  <polygon points="694,440 710,440 702,452" fill="#2E2A26"/>
  <polygon points="694,622 710,622 702,634" fill="#2E2A26"/>
  <polygon points="694,804 710,804 702,816" fill="#2E2A26"/>
  <polygon points="694,976 710,976 702,988" fill="#2E2A26"/>
  <polygon points="694,1162 710,1162 702,1174" fill="#2E2A26"/>
  <polygon points="338,744 354,744 346,728" fill="#2E2A26"/>

  <!-- travelling balls (behind cards) -->
  <circle r="10" fill="#CFC8F4" stroke="#2E2A26" stroke-width="3">
    <animateMotion dur="16s" repeatCount="indefinite" begin="0s"><mpath href="#loop"/></animateMotion>
  </circle>
  <circle r="10" fill="#CFC8F4" stroke="#2E2A26" stroke-width="3">
    <animateMotion dur="16s" repeatCount="indefinite" begin="-8s"><mpath href="#loop"/></animateMotion>
  </circle>

  <!-- ============ TITLE ============ -->
  <text x="540" y="100" text-anchor="middle" class="title">HOW I DECIDE WHAT</text>
  <text x="540" y="168" text-anchor="middle" class="title">GETS AUTOMATED</text>
  <text x="540" y="210" text-anchor="middle" class="subtitle">The exact 6-step system behind every automation we ship.</text>

  <!-- ============ BOX 1: header ============ -->
  <rect x="52" y="285" width="272" height="92" rx="14" fill="rgba(46,42,38,0.16)"/>
  <rect x="48" y="280" width="272" height="92" rx="14" fill="#CFC8F4" stroke="#2E2A26" stroke-width="2.5"/>
  <text x="184" y="315" text-anchor="middle" class="cardh" font-size="20">1. Spot the busywork</text>
  <text x="184" y="344" text-anchor="middle" class="h1sub">Track one week. Don't guess.</text>

  <!-- BOX 1 pills -->
  <g stroke="#2E2A26" stroke-width="2" fill="#E4DFF9">
    <rect x="48" y="390" width="272" height="48" rx="24"/>
    <rect x="48" y="453" width="272" height="48" rx="24"/>
    <rect x="48" y="516" width="272" height="48" rx="24"/>
    <rect x="48" y="579" width="272" height="48" rx="24"/>
    <rect x="48" y="642" width="272" height="48" rx="24"/>
    <rect x="48" y="705" width="272" height="48" rx="24"/>
    <rect x="48" y="768" width="272" height="48" rx="24"/>
    <rect x="48" y="831" width="272" height="48" rx="24"/>
    <rect x="48" y="894" width="272" height="48" rx="24"/>
    <rect x="48" y="957" width="272" height="48" rx="24"/>
    <rect x="48" y="1020" width="272" height="48" rx="24"/>
    <rect x="48" y="1083" width="272" height="48" rx="24"/>
  </g>
  <g text-anchor="middle" class="pill-t">
    <text x="184" y="420">Chasing invoices</text>
    <text x="184" y="483">Lead follow-up</text>
    <text x="184" y="546">CRM data entry</text>
    <text x="184" y="609">Weekly reports</text>
    <text x="184" y="672">Meeting notes</text>
    <text x="184" y="735">Proposal drafts</text>
    <text x="184" y="798">Onboarding emails</text>
    <text x="184" y="861">Support triage</text>
    <text x="184" y="924">Copy-paste between tools</text>
    <text x="184" y="987">Scheduling ping-pong</text>
    <text x="184" y="1050">Chasing approvals</text>
    <text x="184" y="1113">Renaming files... again</text>
  </g>

  <!-- ============ STEP 2 ============ -->
  <rect x="376" y="309" width="660" height="116" rx="14" fill="rgba(46,42,38,0.16)"/>
  <rect x="372" y="304" width="660" height="116" rx="14" fill="#FFFFFF"/>
  <rect x="372" y="304" width="660" height="42" rx="14" fill="#F6C6EA"/>
  <rect x="372" y="325" width="660" height="21" fill="#F6C6EA"/>
  <line x1="372" y1="346" x2="1032" y2="346" stroke="#2E2A26" stroke-width="2"/>
  <rect x="372" y="304" width="660" height="116" rx="14" fill="none" stroke="#2E2A26" stroke-width="2.5"/>
  <text x="702" y="333" text-anchor="middle" class="cardh">2. Write the steps down</text>
  <text x="702" y="378" text-anchor="middle" class="b1">If you can't list the steps, a machine can't run them.</text>
  <text x="702" y="404" text-anchor="middle" class="b2">Task &#8594; numbered steps &#8594; rough sketch of the flow</text>

  <!-- ============ STEP 3 ============ -->
  <rect x="376" y="459" width="660" height="148" rx="14" fill="rgba(46,42,38,0.16)"/>
  <rect x="372" y="454" width="660" height="148" rx="14" fill="#FFFFFF"/>
  <rect x="372" y="454" width="660" height="42" rx="14" fill="#C6D3F6"/>
  <rect x="372" y="475" width="660" height="21" fill="#C6D3F6"/>
  <line x1="372" y1="496" x2="1032" y2="496" stroke="#2E2A26" stroke-width="2"/>
  <rect x="372" y="454" width="660" height="148" rx="14" fill="none" stroke="#2E2A26" stroke-width="2.5"/>
  <text x="702" y="483" text-anchor="middle" class="cardh">3. Score it: hours &#215; pain</text>
  <g fill="#FFFFFF" stroke="#2E2A26" stroke-width="2">
    <rect x="392" y="512" width="196" height="74" rx="10"/>
    <rect x="604" y="512" width="196" height="74" rx="10"/>
    <rect x="816" y="512" width="196" height="74" rx="10"/>
  </g>
  <text x="490" y="542" text-anchor="middle" class="sbt">Frequency</text>
  <text x="490" y="566" text-anchor="middle" class="sbs">daily beats monthly</text>
  <text x="702" y="542" text-anchor="middle" class="sbt">Error cost</text>
  <text x="702" y="566" text-anchor="middle" class="sbs">what breaks if it's wrong?</text>
  <text x="914" y="542" text-anchor="middle" class="sbt">Hate factor</text>
  <text x="914" y="566" text-anchor="middle" class="sbs">the tasks you avoid</text>

  <!-- ============ STEP 4 ============ -->
  <rect x="376" y="641" width="660" height="148" rx="14" fill="rgba(46,42,38,0.16)"/>
  <rect x="372" y="636" width="660" height="148" rx="14" fill="#FFFFFF"/>
  <rect x="372" y="636" width="660" height="42" rx="14" fill="#F6E6B4"/>
  <rect x="372" y="657" width="660" height="21" fill="#F6E6B4"/>
  <line x1="372" y1="678" x2="1032" y2="678" stroke="#2E2A26" stroke-width="2"/>
  <rect x="372" y="636" width="660" height="148" rx="14" fill="none" stroke="#2E2A26" stroke-width="2.5"/>
  <text x="702" y="665" text-anchor="middle" class="cardh">4. Pick the build</text>
  <g fill="#FFFFFF" stroke="#2E2A26" stroke-width="2">
    <rect x="392" y="694" width="196" height="74" rx="10"/>
    <rect x="604" y="694" width="196" height="74" rx="10"/>
    <rect x="816" y="694" width="196" height="74" rx="10"/>
  </g>
  <text x="490" y="724" text-anchor="middle" class="sbt">Pure rules</text>
  <text x="490" y="748" text-anchor="middle" class="sbs">&#8594; n8n workflow</text>
  <text x="702" y="724" text-anchor="middle" class="sbt">Needs judgment</text>
  <text x="702" y="748" text-anchor="middle" class="sbs">&#8594; AI agent</text>
  <text x="914" y="724" text-anchor="middle" class="sbt">High stakes</text>
  <text x="914" y="748" text-anchor="middle" class="sbs">&#8594; human-in-the-loop</text>

  <!-- ============ STEP 5 ============ -->
  <rect x="376" y="823" width="660" height="138" rx="14" fill="rgba(46,42,38,0.16)"/>
  <rect x="372" y="818" width="660" height="138" rx="14" fill="#FFFFFF"/>
  <rect x="372" y="818" width="660" height="42" rx="14" fill="#DCC9F3"/>
  <rect x="372" y="839" width="660" height="21" fill="#DCC9F3"/>
  <line x1="372" y1="860" x2="1032" y2="860" stroke="#2E2A26" stroke-width="2"/>
  <rect x="372" y="818" width="660" height="138" rx="14" fill="none" stroke="#2E2A26" stroke-width="2.5"/>
  <text x="702" y="847" text-anchor="middle" class="cardh">5. Ship ugly in 7 days</text>
  <text x="402" y="898" class="b1">v1 covers 80% of cases.</text>
  <text x="402" y="926" class="b2">Edge cases stay manual for now.</text>
  <g transform="rotate(1.3 871 906)">
    <rect x="730" y="872" width="282" height="68" rx="10" fill="#FFFFFF" stroke="#2E2A26" stroke-width="2"/>
    <text x="871" y="899" text-anchor="middle" class="note">Perfect is procrastination</text>
    <text x="871" y="921" text-anchor="middle" class="note">with a roadmap.</text>
  </g>

  <!-- ============ STEP 6 ============ -->
  <rect x="376" y="995" width="660" height="148" rx="14" fill="rgba(46,42,38,0.16)"/>
  <rect x="372" y="990" width="660" height="148" rx="14" fill="#FFFFFF"/>
  <rect x="372" y="990" width="660" height="42" rx="14" fill="#BFE7C7"/>
  <rect x="372" y="1011" width="660" height="21" fill="#BFE7C7"/>
  <line x1="372" y1="1032" x2="1032" y2="1032" stroke="#2E2A26" stroke-width="2"/>
  <rect x="372" y="990" width="660" height="148" rx="14" fill="none" stroke="#2E2A26" stroke-width="2.5"/>
  <text x="702" y="1019" text-anchor="middle" class="cardh">6. Measure or kill it</text>
  <g fill="#FFFFFF" stroke="#2E2A26" stroke-width="2">
    <rect x="392" y="1048" width="196" height="74" rx="10"/>
    <rect x="604" y="1048" width="196" height="74" rx="10"/>
    <rect x="816" y="1048" width="196" height="74" rx="10"/>
  </g>
  <text x="490" y="1078" text-anchor="middle" class="sbt">Hours saved</text>
  <text x="490" y="1102" text-anchor="middle" class="sbs">per week, tracked</text>
  <text x="702" y="1078" text-anchor="middle" class="sbt">Errors caught</text>
  <text x="702" y="1102" text-anchor="middle" class="sbs">before clients see them</text>
  <text x="914" y="1078" text-anchor="middle" class="sbt">No impact?</text>
  <text x="914" y="1102" text-anchor="middle" class="sbs">delete it at day 30</text>

  <!-- ============ CHECKLIST STRIP ============ -->
  <rect x="52" y="1181" width="176" height="62" rx="12" fill="rgba(46,42,38,0.16)"/>
  <rect x="48" y="1176" width="176" height="62" rx="12" fill="#F2BFAD" stroke="#2E2A26" stroke-width="2.5"/>
  <text x="136" y="1213" text-anchor="middle" class="lbl">Before it ships</text>
  <g fill="#FFFFFF" stroke="#2E2A26" stroke-width="2">
    <rect x="240" y="1185" width="144" height="44" rx="22"/>
    <rect x="402" y="1185" width="144" height="44" rx="22"/>
    <rect x="564" y="1185" width="144" height="44" rx="22"/>
    <rect x="726" y="1185" width="144" height="44" rx="22"/>
    <rect x="888" y="1185" width="144" height="44" rx="22"/>
  </g>
  <g text-anchor="middle" class="chk">
    <text x="312" y="1212">Repeats weekly</text>
    <text x="474" y="1212">Steps written</text>
    <text x="636" y="1212">Owner named</text>
    <text x="798" y="1212">Fallback exists</text>
    <text x="960" y="1212">Savings tracked</text>
  </g>
</svg>

</body>
</html>
